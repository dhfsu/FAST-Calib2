# Camera intrinsics
  # Camera model: pinhole (default) or fisheye.
  # "fisheye" is the Kannala-Brandt / equidistant model (cv::fisheye, Kalibr
  # "equidistant", FAST-LIVO2 EquidistantCamera) with 4 coefficients k1..k4.
  # Accepted aliases: equidistant, EquidistantCamera, kb4, kannala_brandt,
  # opencv_fisheye (case-insensitive). Any other value is rejected at startup.
  camera_model: pinhole
  # Resolution used when calibrating the active intrinsics below.
  # For a fisheye camera this must be the RAW image resolution.
  camera_width: 2448
  camera_height: 2048
  fx: 2364.049767406230
  fy: 2368.875165893467
  cx: 1211.209298385360
  cy: 1040.561211270159
  k1: -0.051619025360610
  k2: 0.125944589327291
  p1: -0.0002140931408129925
  p2: 0.0006409200928440982
  # Fisheye only: the 3rd and 4th Kannala-Brandt coefficients. Ignored for pinhole.
  # (Legacy fisheye configs that kept them in p1/p2 still load, with a warning.)
  # k3: 0.0
  # k4: 0.0
  # Fisheye only: off-axis cutoff. Markers whose corners lie outside the model's
  # monotonic range are dropped; wide-angle lenses are usually black there.
  # fisheye_max_theta_deg: 89.0

# ===== Fisheye camera example (vanjee, 4000x3000, Kannala-Brandt) =====
# Fill in the intrinsics from scripts/calibrate_fisheye_intrinsics.py
# (its equidistant.yaml holds fx, fy, cx, cy and k1..k4), then replace the block
# above with:
#   camera_model: fisheye
#   camera_width: 4000
#   camera_height: 3000
#   fx: 792.4057085207388
#   fy: 792.3582580692001
#   cx: 2004.5367643055422
#   cy: 1500.454819537657
#   k1:  0.09095816477283435
#   k2: -0.02448764621169176
#   k3:  0.008319662193425007
#   k4: -0.0036367895734679048
#   fisheye_max_theta_deg: 89.0
# and point lidar_topic/bag_path/image_path at the fisheye rig, e.g.
#   lidar_topic: "/vanjee_points722"

# Calibration target parameters
  marker_size: 0.20 # ArUco marker side length; adjust to match your physical target
  delta_width_qr_center: 0.55 # Half the distance between the centers of two markers in the horizontal direction 
  delta_height_qr_center: 0.35 # Half the distance between the centers of two markers in the vertical direction
  delta_width_circles: 0.5 # Distance between the centers of two annuli in the horizontal direction
  delta_height_circles: 0.4 # Distance between the centers of two annuli in the vertical direction
  circle_radius: 0.12 # Radius of the reflective annulus centerline
  annulus_half_width: 0.025 # Half width of annulus band: (outer radius - inner radius) / 2
  board_width: 1.4
  board_height: 1.0
  board_roi_margin: 0.08
  board_roi_depth: 0.12
  auto_roi_voxel_leaf: 0.01
  annulus_voxel_leaf: 0.005
  auto_roi_geometry_max_error: 0.10

  use_auto_lidar_roi: true

# Input
  # LiDAR mounting axes. Each value answers which signed native LiDAR axis
  # points in that physical direction. Left is derived as up x forward.
  # Bundled AVIA data uses the standard +X-forward, +Y-left, +Z-up mounting.
  lidar_forward_axis: "+x"
  lidar_up_axis: "+z"
  lidar_topic: "/livox/lidar"
  bag_path: "$(find fast_calib)/calib_data/avia/mid.bag"
  image_path: "$(find fast_calib)/calib_data/avia/mid.bmp"

# Output
  output_path: "$(find fast_calib)/output"
