# Camera intrinsics
  # Camera model: pinhole (default), fisheye or omni.
  # "fisheye" is the Kannala-Brandt / equidistant model (cv::fisheye, Kalibr
  # "equidistant", FAST-LIVO2 EquidistantCamera) with 4 coefficients k1..k4.
  # "omni" is the Mei unified model (Kalibr "omni-radtan", cv::omnidir,
  # camodocal CataCamera): one mirror parameter xi plus radtan k1/k2/p1/p2.
  # Accepted aliases: equidistant, EquidistantCamera, kb4, kannala_brandt,
  # opencv_fisheye, omni, OmniCamera, mei, unified, omnidir (case-insensitive).
  # Any other value is rejected at startup.
  # camera_model: pinhole
  # # Resolution used when calibrating the active intrinsics below.
  # # For a fisheye camera this must be the RAW image resolution.
  # camera_width: 2448
  # camera_height: 2048
  # fx: 2364.049767406230
  # fy: 2368.875165893467
  # cx: 1211.209298385360
  # cy: 1040.561211270159
  # k1: -0.051619025360610
  # k2: 0.125944589327291
  # p1: -0.0002140931408129925
  # p2: 0.0006409200928440982
  # omni only: the Mei mirror parameter. xi = 0 degenerates to a pinhole camera.
  # Ignored for the other models.
  # xi: 2.51429029
  # Fisheye only: the 3rd and 4th Kannala-Brandt coefficients. Ignored for pinhole.
  # (Legacy fisheye configs that kept them in p1/p2 still load, with a warning.)
  # k3: 0.0
  # k4: 0.0
  # Fisheye/omni: off-axis cutoff. Markers whose corners lie outside the model's
  # invertible range are dropped; wide-angle lenses are usually black there.
  # For omni the cutoff is additionally clamped to the model limit acos(-1/xi)
  # (113.4 deg for the example below), beyond which pixels no longer map to a
  # unique ray.
  # max_theta_deg: 89.0        # new name, applies to both wide-angle models
  # fisheye_max_theta_deg: 89.0  # legacy alias, still accepted

# ===== Fisheye camera example (vanjee, 4000x3000, Kannala-Brandt) =====
# Fill in the intrinsics from scripts/calibrate_fisheye_intrinsics.py
# (its equidistant.yaml holds fx, fy, cx, cy and k1..k4), then replace the block
# above with:
  # camera_model: fisheye
  # camera_width: 4000
  # camera_height: 3000
  # fx: 794.4112180000000
  # fy: 794.4112180000000
  # cx: 2000.5818810000001
  # cy: 1492.9195150000000
  # k1: 0.08030415090000000
  # k2: -0.00769975350000000
  # k3: -0.00588536510000000
  # k4: 0.00054278710000000
  # fisheye_max_theta_deg: 89.0
#and point lidar_topic/bag_path/image_path at the fisheye rig, e.g.
  # lidar_topic: "/vanjee_points722"

# ===== omni camera example (Mei unified model, Kalibr "omni-radtan") =====
# Differences from the fisheye block above:
#   * one extra mirror parameter xi;
#   * the distortion is radtan [k1 k2 p1 p2] applied to
#     m = (X/(Z+xi*||P||), Y/(Z+xi*||P||)) -- NOT to X/Z -- so k1 is not
#     comparable to a pinhole k1 (here 1.30 vs the usual 0.0x);
#   * the usable field of view is capped by the model at acos(-1/xi)
#     (113.4 deg for xi = 2.514), where the projection folds back.
# Replace the fisheye block above with this one to switch models.
  camera_model: omni
  camera_width: 4000
  camera_height: 3000
  fx: 2807.01306999
  fy: 2797.89971093
  cx: 1989.46523453
  cy: 1496.79906500
  xi: 2.51429029
  k1: 1.30034009
  k2: 0.07687779
  p1: 0.00327167
  p2: -0.00028419
  max_theta_deg: 89.0

# Calibration target parameters
  marker_size: 0.20 # ArUco marker side length; adjust to match your physical target
  delta_width_qr_center: 0.55 # Half the distance between the centers of two markers in the horizontal direction 
  delta_height_qr_center: 0.35 # Half the distance between the centers of two markers in the vertical direction
  delta_width_circles: 0.5 # Distance between the centers of two annuli in the horizontal direction
  delta_height_circles: 0.4 # Distance between the centers of two annuli in the vertical direction
  circle_radius: 0.12 # Radius of the reflective annulus centerline
  annulus_half_width: 0.025 # Half width of annulus band: (outer radius - inner radius) / 2
  board_width: 1.4
  board_height: 1.0
  board_roi_margin: 0.08
  board_roi_depth: 0.12
  auto_roi_voxel_leaf: 0.01
  annulus_voxel_leaf: 0.005
  auto_roi_geometry_max_error: 0.10

  use_auto_lidar_roi: false
# range values in order:
  x_min: -1.7
  x_max: -0.2
  y_min: 1.8
  y_max: 2.7
  z_min: -0.5
  z_max: 0.5


# Input
  # LiDAR mounting axes. Each value answers which signed native LiDAR axis
  # points in that physical direction. Left is derived as up x forward.
  # Bundled AVIA data uses the standard +X-forward, +Y-left, +Z-up mounting.
  lidar_forward_axis: "+y"
  lidar_up_axis: "+z"
  lidar_topic: "/vanjee_points722"
  bag_path: "/root/catkin_ws/vanjeeDataset/skew-cam/cam4_left_1_trim.bag"
  image_path: "/root/catkin_ws/vanjeeDataset/skew-cam/cam4_left_1.jpg"

# Output
  output_path: "$(find fast_calib)/output"
